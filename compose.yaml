services:
  postgres:
    image: pgvector/pgvector:pg19
    container_name: monorepo-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d app']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/app
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-compose-dev-only-secret-0123456789abcdef0123456789abcdef}
    command: ['node', 'dist/db/migrate.js', 'up']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/app
      DATABASE_POOL_MAX: 10
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-compose-dev-only-secret-0123456789abcdef0123456789abcdef}
      BETTER_AUTH_URL: ${PUBLIC_ORIGIN:-http://localhost:8080}
      CORS_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      TRUST_PROXY: '1'
      LOG_LEVEL: info
      LOG_PRETTY: 'false'
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_CHAT_MODEL: ${OPENROUTER_CHAT_MODEL:-google/gemini-2.5-flash}
      OPENROUTER_VISION_MODEL: ${OPENROUTER_VISION_MODEL:-google/gemini-2.5-flash}
      EMBEDDING_CACHE_DIR: /models
    ports:
      - '3000:3000'
    volumes:
      # bge-m3 model cache so the download happens once, not per container.
      - models-cache:/models
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '8080:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  models-cache:
